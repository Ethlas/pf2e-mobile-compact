name: Verify JS, HTML/HBS & Sheet Actions

on:
  pull_request:
    branches: [main, master]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main, master]

jobs:
  verify:
    name: Static & Interactive Sheet Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate Conventional Commit PR prefix & module.json version (Pull Requests)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          node -e '
            const { execSync } = require("node:child_process");
            const fs = require("node:fs");

            const prTitle = (process.env.PR_TITLE || "").trim();
            const baseRef = process.env.BASE_REF || "main";

            console.log(`PR Title: "${prTitle}"`);

            // Conventional Commits v1.0.0 pattern: <type>[optional scope][!]: <description>
            const ccRegex = /^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-zA-Z0-9_./-]+\))?(!)?:\s+(.+)$/;
            const match = prTitle.match(ccRegex);

            if (!match) {
              console.error(`\n✖ ERROR: Pull Request title must follow Conventional Commits v1.0.0 format:`);
              console.error(`  <type>[optional scope][!]: <description>`);
              console.error(`  Specification: https://www.conventionalcommits.org/en/v1.0.0/`);
              console.error(`  Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert`);
              console.error(`  Examples:`);
              console.error(`    fix(webkit): draw custom arrows on header dropdowns`);
              console.error(`    feat(spells): add heightened spell damage button`);
              console.error(`    ci(workflow): require conventional commit prefix on PRs`);
              process.exit(1);
            }

            const [, commitType, rawScope, breakingBang] = match;
            const isReleasePrefix = commitType === "feat" || commitType === "fix";

            const prMod = JSON.parse(fs.readFileSync("module.json", "utf8"));
            const prVer = prMod.version;

            let baseVer = "0.0.0";
            try {
              const baseRaw = execSync(`git show origin/${baseRef}:module.json`, { encoding: "utf8" });
              baseVer = JSON.parse(baseRaw).version;
            } catch (err) {
              console.warn(`Could not read module.json from origin/${baseRef}:`, err.message);
            }

            const parseSemVer = (v) => {
              if (!/^\d+\.\d+\.\d+$/.test(v || "")) {
                throw new Error(`Invalid SemVer "${v}" in module.json (expected MAJOR.MINOR.PATCH)`);
              }
              return v.split(".").map(Number);
            };

            const [pMaj, pMin, pPat] = parseSemVer(prVer);
            const [bMaj, bMin, bPat] = parseSemVer(baseVer);

            const isGreater =
              pMaj > bMaj ||
              (pMaj === bMaj && pMin > bMin) ||
              (pMaj === bMaj && pMin === bMin && pPat > bPat);

            console.log(`Conventional Commit Type : ${commitType}${rawScope || ""}${breakingBang || ""}`);
            console.log(`Triggers Release Package : ${isReleasePrefix ? "YES (fix/feat)" : "NO"}`);
            console.log(`Base (${baseRef}) version      : ${baseVer}`);
            console.log(`PR head version          : ${prVer}`);

            if (isReleasePrefix) {
              if (!isGreater) {
                console.error(`\n✖ ERROR: PR has release prefix "${commitType}:" so module.json version (${prVer}) must be incremented above ${baseRef} (${baseVer}).`);
                console.error(`  Run: node scripts/bump-version.mjs ${commitType === "feat" ? "feature" : "bugfix"} "Brief description"`);
                process.exit(1);
              }

              try {
                execSync(`git rev-parse -q --verify "refs/tags/v${prVer}"`, { stdio: "ignore" });
                console.error(`\n✖ ERROR: Git tag "v${prVer}" already exists. Please increment module.json to a new unused version.`);
                process.exit(1);
              } catch {
                // Tag does not exist yet — good!
              }

              console.log(`✔ Release PR verified: "${commitType}:" prefix with version increment ${baseVer} -> ${prVer} (tag v${prVer} is available)`);
            } else {
              console.log(`✔ Non-release PR prefix "${commitType}:" verified (module packaging will be skipped on merge).`);
            }
          '

      - name: Run JS, HTML/Handlebars, CSS & Section Handler Verifications
        run: node scripts/verify.mjs
