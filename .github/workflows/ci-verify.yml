name: Verify JS, HTML/HBS & Sheet Actions

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  verify:
    name: Static & Interactive Sheet Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Verify module.json version has incremented (Pull Requests)
        if: github.event_name == 'pull_request'
        run: |
          node -e '
            const { execSync } = require("node:child_process");
            const fs = require("node:fs");

            const baseRef = process.env.GITHUB_BASE_REF || "main";
            const prMod = JSON.parse(fs.readFileSync("module.json", "utf8"));
            const prVer = prMod.version;

            let baseVer = "0.0.0";
            try {
              const baseRaw = execSync(`git show origin/${baseRef}:module.json`, { encoding: "utf8" });
              baseVer = JSON.parse(baseRaw).version;
            } catch (err) {
              console.warn(`Could not read module.json from origin/${baseRef}:`, err.message);
            }

            const parseSemVer = (v) => {
              if (!/^\d+\.\d+\.\d+$/.test(v || "")) {
                throw new Error(`Invalid SemVer "${v}" in module.json (expected MAJOR.MINOR.PATCH)`);
              }
              return v.split(".").map(Number);
            };

            const [pMaj, pMin, pPat] = parseSemVer(prVer);
            const [bMaj, bMin, bPat] = parseSemVer(baseVer);

            const isGreater =
              pMaj > bMaj ||
              (pMaj === bMaj && pMin > bMin) ||
              (pMaj === bMaj && pMin === bMin && pPat > bPat);

            console.log(`Base (${baseRef}) version : ${baseVer}`);
            console.log(`PR head version       : ${prVer}`);

            if (!isGreater) {
              console.error(`\n✖ ERROR: module.json version (${prVer}) must be incremented above ${baseRef} (${baseVer}) before merging.`);
              console.error(`  Run: node scripts/bump-version.mjs <bugfix|feature|full> "Brief description"`);
              process.exit(1);
            }

            try {
              execSync(`git rev-parse -q --verify "refs/tags/v${prVer}"`, { stdio: "ignore" });
              console.error(`\n✖ ERROR: Git tag "v${prVer}" already exists. Please increment module.json to a new unused version.`);
              process.exit(1);
            } catch {
              // Tag does not exist yet — good!
            }

            console.log(`✔ Version increment verified: ${baseVer} -> ${prVer} (tag v${prVer} is available)`);
          '

      - name: Run JS, HTML/Handlebars, CSS & Section Handler Verifications
        run: node scripts/verify.mjs
