name: Verify JS, HTML/HBS & Sheet Actions

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  verify:
    name: Static & Interactive Sheet Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run JS, HTML/Handlebars, CSS & Section Handler Verifications
        run: node scripts/verify.mjs
