name: Package & Release Module

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci-verify.yml
    permissions:
      contents: read

  build-and-release:
    name: Package Foundry VTT Module & Create Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dev tooling
        run: npm ci

      - name: Determine version and check if release is needed
        id: get_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-check.mjs

      - name: Build module package
        if: steps.get_version.outputs.should_release == 'true'
        run: node scripts/build.mjs --tag "${{ steps.get_version.outputs.tag }}"

      - name: Publish GitHub Release & Assets
        if: steps.get_version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_version.outputs.tag }}
        run: |
          gh release create "${TAG}" dist/module.zip dist/module.json \
            --title "Release ${TAG}" \
            --target "${{ github.sha }}" \
            --generate-notes
